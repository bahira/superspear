<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aldarion Knight — blockout review (img2threejs)</title>
<style>
  body{margin:0;overflow:hidden;background:#15171c;font-family:ui-monospace,monospace;color:#cfd6dd}
  #bar{position:fixed;top:12px;left:12px;z-index:5;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px;font-size:11px}
  button{font:inherit;background:#f4c170;border:0;border-radius:4px;padding:5px 10px;cursor:pointer;color:#131008}
</style>
</head>
<body>
<div id="bar">blockout pass — tourne auto · <button id="shot">📸 capture review</button></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
               "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import {
  createAldarionKnightModel,
  createAldarionKnightLookDevLights,
  createAldarionKnightEnvironment,
  frameAldarionKnightCamera,
  configureAldarionKnightRenderer,
} from "./createAldarionKnight.js";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
configureAldarionKnightRenderer(renderer);
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3d42); // gris neutre de la planche

const model = createAldarionKnightModel();
scene.add(model);
scene.add(createAldarionKnightLookDevLights());
scene.environment = createAldarionKnightEnvironment(renderer);
renderer.toneMappingExposure = 3.0; // ponytail: lumières LookDev calibrées court-courant; exposure compense l'échelle 16u
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(8, 18, 12);
scene.add(keyLight);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
frameAldarionKnightCamera(camera, model);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// mode déterministe pour les gates : ?pose=front|left|right|back
const poseParam = new URLSearchParams(location.search).get("pose");
if (poseParam) {
  controls.autoRotate = false;
  const R = 34, H = 9;
  const angles = { front: 0, right: -Math.PI / 2, back: Math.PI, left: Math.PI / 2 };
  const a = angles[poseParam] ?? 0;
  camera.position.set(Math.sin(a) * R, H, Math.cos(a) * R);
  controls.target.set(0, 8.5, 0);
  controls.update();
}

document.getElementById("shot").onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement("a");
  a.download = "knight-blockout.png";
  a.href = renderer.domElement.toDataURL("image/png");
  a.click();
};
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
