name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Simplify rules self-check
        run: npx tsx scripts/test-simplify.ts

      # Catches codegen drift: import signatures, protected-division rails,
      # opcode swaps — across every ledger champion with an AST.
      - name: WASM↔JS parity (all ledger champions)
        run: npx tsx scripts/test-wasm-parity.ts

      # Blocks obsolete "hard mode / unservable" premises: when a marker claims
      # a primitive is missing but the engine serves it (the grover_amplitude
      # pattern), CI fails until the task is re-scaffolded and audited.
      - name: Scaffold audit (stale hard-mode markers)
        run: npx tsx scripts/audit-scaffolds.ts --strict

      # End-to-end loop smoke: dual-population breeding, OOD gate, asin op,
      # per-task ledger writes + bundle rebuild.
      - name: Heritage loop smoke
        run: npx tsx scripts/test-heritage.ts

      # price-fast must be idempotent: second run prices nothing new and the
      # bundle must stay byte-stable (guards the unified post-run chain).
      - name: Ledger I/O idempotency
        run: |
          npx tsx scripts/price-fast.ts > /dev/null
          cp spear-hall-of-fame.json /tmp/ledger-a.json
          npx tsx scripts/price-fast.ts > /dev/null
          cmp spear-hall-of-fame.json /tmp/ledger-a.json

      # Every champion must reproduce its own numbers. Recomputes metric,
      # level, cost, speedup, holdout, OOD and r² from each stored AST and
      # fails on any contradiction — this is what caught the ledger shipping
      # un-shaped fast slots (`atan(x)` labelled with the MSE of
      # `0.351631·atan(x) + 0.5`) and GPU-profile costs compared against
      # CPU-profile references.
      - name: Champion audit (records must reproduce)
        run: npx tsx scripts/audit-champions.ts --strict

      # Datasets must not depend on the search seed or on task-construction
      # order, otherwise "best across all seeds" compares incomparable numbers.
      - name: Dataset determinism
        run: npx tsx scripts/test-dataset-determinism.ts

      # The cost model is a hypothesis about hardware. Compile champion and
      # exact law to C99, time both, and fail if the model's predictions do not
      # survive contact with a real CPU. Rows whose two kernels differ by less
      # than measurement noise are excluded rather than counted as wins.
      # The README advertises MISRA-C:2012 export with machine-checked C<->WASM
      # parity. Nothing enforced it: this audit was never wired into CI, and
      # when first run it failed 89/89 because it linked without -lm.
      - name: MISRA-C export, gcc -std=c99 build, C<->WASM parity
        run: npx tsx scripts/export-audit.ts

      - name: Wall-clock vs cost model
        run: npx tsx scripts/bench-wallclock.ts

      # NOTE: we deliberately do NOT diff stored wall-clock numbers against a
      # fresh run here. Those numbers are hardware-specific (they were measured
      # on the machine that produced them) and a GitHub runner is a different
      # CPU, so any equality/tolerance check would compare two machines and
      # fail for reasons that say nothing about the code. An earlier version of
      # this step did exactly that and failed on CI while passing locally.
      #
      # The portable invariant is checked instead: no kernel may advertise a
      # speedup it does not have. audit-champions --strict enforces it via the
      # `speedup-not-real` rule, and it re-derives everything from the ASTs, so
      # it is machine-independent. Refreshing the measurements is an explicit
      # local action: npx tsx scripts/write-measured-speed.ts && npx tsx scripts/repair-ledger.ts
      - name: Measured-speed blocks are well-formed
        run: |
          npx tsx -e '
            import { loadLedger } from "./src/lib/spear/ledger";
            const led: any = loadLedger();
            let bad = 0;
            for (const [id, e] of Object.entries(led) as [string, any][]) {
              const m = e.speed?.measured;
              if (!m) continue;
              const ok =
                typeof m.measuredSpeedup === "number" && m.measuredSpeedup > 0 &&
                typeof m.nsFormula === "number" && m.nsFormula > 0 &&
                typeof m.nsExact === "number" && m.nsExact > 0 &&
                typeof m.resolvable === "boolean" && typeof m.harness === "string";
              if (!ok) { console.error(`[${id}] malformed speed.measured block`); bad++; }
              if (m.resolvable && e.speed.speedupSource !== "measured") {
                console.error(`[${id}] has a resolvable measurement but speedup is not sourced from it`);
                bad++;
              }
            }
            if (bad) { console.error(`::error::${bad} malformed measured-speed entries`); process.exit(1); }
            console.log("measured-speed blocks: all well-formed and authoritative where resolvable");
          '
